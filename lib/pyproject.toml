[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-tenable-sc-connector"
version = "1.0.0"
description = "Gestión de vulnerabilidades con Tenable Security Center: listar vulnerabilidades, consultar activos y hallazgos, listar y lanzar escaneos"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_tenable_sc_connector*"]
